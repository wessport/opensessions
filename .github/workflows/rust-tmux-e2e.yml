name: Rust tmux E2E

on:
  pull_request:
  push:
    branches: [main, rust-main]

jobs:
  tmux-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3 tmux dash curl

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Build binaries used by tmux E2E
        run: cargo build --workspace --bins

      # Unit tests, private-socket tmux integration tests, and the tmux sidebar
      # E2E suite, all against the runner's tmux (3.4 on Ubuntu 24.04).
      - name: Run Rust tests
        run: cargo test --workspace --no-fail-fast

      - name: Run script and integration tests
        run: bun test scripts/
